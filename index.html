<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://sillyslycotton.github.io/flippedcardgames/assets/fcgfavicon.ico">
<style>
body {
  margin: 0px;
  background-color: black;
}
.wrapper {
  margin: 30px;
}
a.buttonlink {
  color: black;
  text-decoration: none;
}
.main {
  background-color: transparent;
  background-image: linear-gradient(to right, #141414 , transparent, transparent, transparent, #141414);
  color: white;
  font-family: "Ubuntu Mono";
  text-align: center;
  border: 2px solid white;
  border-radius: 15px;
  margin: auto;
  margin-bottom: 20px;
  padding: 20px;
  width: 700px;
  transition-duration: 0.2s;
}
hr.rounded {
  border-top: 2px solid white;
  border-radius: 5px;
}
.button {
  background-color: white;
  border-radius: 50px;
  color: black;
  font-family: "Ubuntu Mono";
  text-align: center;
  font-size: 20px;
  margin: 10px;
  padding: 10px;
  transition-duration: 0.2s;
}
.button:hover {
  padding: 15px;
  transition-duration: 0.2s;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="main header">
  <img src="https://sillyslycotton.github.io/flippedcardgames/assets/fcglogo.svg" box-shadow>
  <h2>Flipped Card Games</h2>
  </div>

  <div class="main playables">
  <h2>Playables</h2>
  <hr class="rounded">
  <a class="buttonlink" href="https://sillyslycotton.github.io/flippedcardgames/games/gem">
    <button class="button">Gem Test</button>
  </a>
  </div>
</div>

</body>
</html>
